name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest
      - name: Diagrams in step with the script
        run: python3 tools/check-diagrams.py APRESENTACAO.md RESUMO.md site/img
      - name: Build
        run: |
          python3 tools/build-site.py deck site/index.html
          python3 tools/build-site.py deck-resumo site/resumo.html RESUMO.md
      - name: Public-text guard
        env:
          FORBIDDEN_EXTRA: ${{ secrets.FORBIDDEN_EXTRA }}
        run: python3 tools/check-public.py APRESENTACAO.md RESUMO.md README.md deck deck-resumo site/index.html site/resumo.html site/img/*.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
